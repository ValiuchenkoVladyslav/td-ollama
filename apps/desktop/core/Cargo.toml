[package]
name = "td-ollama-core"
version = "1.0.0"
edition = "2021"

[dependencies]
# core
tauri = { version = "2.0.0-rc.5", default-features = false, features = ["wry", "objc-exception", "compression"] }
teloxide = { version = "0.13", default-features = false, features = ["native-tls"] }
tauri-plugin-shell = "2.0.0-rc.2"
serenity = { version = "0.12", default-features = false, features = ["rustls_backend", "standard_framework", "gateway", "client"] }
# utils (versions reused from core deps)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "*", default-features = false, features = ["system"] }
reqwest = { version = "*", default-features = false, features = ["default-tls", "stream"] }
futures = { version = "*", default-features = false, features = ["std"] }
bytes = "1"

[build-dependencies]
tauri-build = { version = "2.0.0-rc.5", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
